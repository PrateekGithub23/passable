# CI: every push and pull request runs the Go tests (unit, property, golden, race detector,
# integration against real Postgres+Redis in Docker) and the frontend checks.
# CD: a push to main that passes CI deploys the API to Fly.io (when FLY_API_TOKEN is set).
# The frontend deploys through Vercel's GitHub integration (configured in the Vercel dashboard).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags integration ./integration
      - name: Unit, property and golden tests (race detector on)
        run: go test -race ./...
      - name: "Integration tests (testcontainers: PostGIS + Redis)"
        run: go test -race -tags integration ./integration

  web:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # LTS; Node 20 reached end of life in April 2026
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid # build-only placeholder

  deploy-api:
    name: Deploy API to Fly.io
    needs: [go, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-api # never two deploys at once
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
      - name: Skip (no FLY_API_TOKEN secret yet)
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN is not set; skipping deploy."
