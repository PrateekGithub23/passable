# CI: every push and pull request runs the Go tests (unit, property, golden, race detector,
# integration against real Postgres+Redis in Docker), the frontend checks, and a Trivy scan
# plus Kubernetes (kind) smoke test of the API image.
# CD: a push to main that passes all of them deploys the API to Azure Container Apps (once the
# AZURE_* secrets are set; see scripts/azure-setup.sh).
# The frontend deploys through Vercel's GitHub integration (configured in the Vercel dashboard).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags integration ./integration
      - name: Unit, property and golden tests (race detector on)
        run: go test -race ./...
      - name: "Integration tests (testcontainers: PostGIS + Redis)"
        run: go test -race -tags integration ./integration

  web:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # LTS; Node 20 reached end of life in April 2026
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid # build-only placeholder

  # The deployable artifact itself: build the API image, scan it, then run it on Kubernetes.
  k8s:
    name: Image scan + Kubernetes smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build API image
        run: docker build -t passable-api:local .
      # Fail on any HIGH/CRITICAL vulnerability that has a fix available (unfixed ones can't be
      # acted on). Trivy runs from its pinned official image rather than a third-party action.
      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 \
            image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 passable-api:local
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0
      # The real OSM extract for the bbox, cached so the public Overpass API is only queried
      # when the fetch script changes (or the cache is evicted after a week unused).
      - name: Cache OSM data
        id: osm
        uses: actions/cache@v4
        with:
          path: data
          key: osm-${{ hashFiles('scripts/fetch_osm.sh') }}
      - name: Fetch OSM data
        if: steps.osm.outputs.cache-hit != 'true'
        run: scripts/fetch_osm.sh
      # Same script as local development: kind cluster, Postgres+PostGIS, Redis, NetworkPolicies,
      # migration Job, graph import, 2 API replicas; then health, a real route, and a hazard
      # posted to one replica arriving over WebSocket on the other (via Redis pub/sub).
      - name: Deploy to kind and smoke-test
        run: scripts/k8s-up.sh
      - name: Cluster state (on failure)
        if: failure()
        run: |
          kubectl -n passable get all,networkpolicy
          kubectl -n passable describe pods | tail -60
          kubectl -n passable logs -l app=passable-api --tail=50 || true

  # Production: Azure Container Apps (DECISIONS #34). The image goes to GitHub Container
  # Registry (free for public images); Azure pulls it from there.
  deploy-api:
    name: Deploy API to Azure Container Apps
    needs: [go, web, k8s]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-api # never two deploys at once
    permissions:
      contents: read
      packages: write # push the image to ghcr.io with the workflow's own token
      id-token: write # OIDC: GitHub vouches for this workflow to Azure; no Azure password stored
    env:
      IMAGE: ghcr.io/prateekgithub23/passable-api
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build and push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
      # Schema first, then code (what Fly's release_command did): a failed migration stops here.
      - name: Migrate the production database
        if: env.AZURE_CLIENT_ID != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: go run ./cmd/migrate
      - uses: azure/login@v2
        if: env.AZURE_CLIENT_ID != ''
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # New revision on the commit's image. Container Apps starts it, waits for the startup and
      # readiness probes (/healthz), then moves traffic over.
      - name: Roll out
        if: env.AZURE_CLIENT_ID != ''
        run: |
          az containerapp update -n passable-api -g passable-rg --image "$IMAGE:${{ github.sha }}" -o none
          fqdn=$(az containerapp show -n passable-api -g passable-rg --query properties.configuration.ingress.fqdn -o tsv)
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://$fqdn/healthz"
      - name: Skip (Azure not configured yet)
        if: env.AZURE_CLIENT_ID == ''
        run: echo "AZURE_CLIENT_ID is not set; image pushed, deploy skipped."
