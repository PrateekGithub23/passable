# Fly.io config for the Go API. App names are global on Fly: if "passable-api" is taken,
# `fly launch --no-deploy --copy-config` will offer to change it here.
app = "passable-api"
primary_region = "iad"            # US East, next to Neon's us-east-1

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs once per deploy, in a temporary machine with the app's secrets, before new API
  # machines start: schema changes land first, and a failed migration aborts the deploy.
  release_command = "/app/migrate"

[env]
  PORT = "8080"
  # Fly's proxy puts the real client address here; rate limits key on it (DECISIONS #25).
  TRUSTED_IP_HEADER = "Fly-Client-IP"
  # Expiry + missed-event catch-up cadence. Longer than the 30 s default so a free-tier
  # Postgres that suspends when idle isn't woken every 30 s; TTLs are hours, so 10 min is fine.
  EXPIRY_INTERVAL = "10m"
  # Browser origins allowed to call the API: the production site, plus local development.
  CORS_ORIGINS = "https://passable-alpha.vercel.app,http://localhost:3000"
  # Secrets (set with `fly secrets set`, never committed): DATABASE_URL, REDIS_URL

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero (DECISIONS #32): Fly's proxy stops the machine when no requests or WebSocket
  # connections are open, and starts it again on the next request. That keeps the free trial's
  # machine time for when someone is actually using the site. The cost is a cold start of
  # ~2-4 s (boot + graph load + Neon wake-up) for the first visitor after a quiet spell.
  # Reports that expired while it slept are expired at startup (cmd/api ExpireDue).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
