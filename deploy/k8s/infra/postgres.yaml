# Postgres + PostGIS for the local cluster: the same image as docker-compose.yml and the
# integration tests. A StatefulSet (not a Deployment) because it owns a persistent volume and
# needs a stable identity; production uses managed Postgres (Neon) instead.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: passable-secrets
          env:
            # A subdirectory, because the volume's root contains lost+found and initdb
            # refuses to run in a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          # Ready = accepting connections; the migrate Job waits for this.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "passable", "-d", "passable"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
